name: CI

# Runs the same checks you can run locally (see "CI" in README.md). No secrets, no deploys, no network access to
# real devices or AWS: the suite uses the demo simulators and fakes only.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          # - os: ubuntu-latest      # enable when actions/setup-python ships 3.15 (the project is developed on it)
          #   python: "3.15"
    steps:
      # Actions are pinned to full commit SHAs (dependabot keeps them current).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ruff
      - name: Lint
        run: ruff check src --select F,E9,B --ignore B008
      - name: Tests
        run: pytest -q

  lockfile:
    name: hashed lockfile install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install from requirements.lock with hashes
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements.lock
          pip install --no-deps -e .
          pip install pytest==9.2.0
      - name: Tests on the locked versions
        run: pytest -q

  wheel:
    name: wheel build and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Wheel contains the packaged data files
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ["nettrace/data/nettrace-readonly-policy.json", "nettrace/web/static/app.html"]
          missing = [n for n in need if n not in names]
          assert not missing, f"missing from wheel: {missing}"
          print("wheel ok:", whl)
          PY
      - name: Install in a clean venv outside the source tree and smoke-test
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/nettrace" --help
          "$RUNNER_TEMP/venv/bin/nettrace" demo scenarios
          "$RUNNER_TEMP/venv/bin/python" -c "import json; from importlib.resources import files; p = json.loads(files('nettrace.data').joinpath('nettrace-readonly-policy.json').read_text()); assert p['Statement']; print('session policy loads from the wheel')"
